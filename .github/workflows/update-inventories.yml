name: Update inventories

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 1"

permissions:
  contents: read

concurrency:
  group: update-inventories
  cancel-in-progress: false

jobs:
  update:
    name: Update ${{ matrix.name }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Nix installers
            app: update-nix-installers
            inventory: installers/nix.json
            branch: ci/nix-installers-update
          - name: macOS images
            app: update-images
            inventory: images/macos.json
            branch: ci/macos-images-update
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Update inventory
        run: nix run .#${{ matrix.app }} --no-update-lock-file

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.CI_PR_TOKEN }}
          commit-message: Update ${{ matrix.name }}
          title: Update ${{ matrix.name }}
          body: Automated weekly update of ${{ matrix.name }}.
          branch: ${{ matrix.branch }}
          base: main
          delete-branch: true
          add-paths: ${{ matrix.inventory }}

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.CI_PR_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr merge --auto --merge "$PR_NUMBER"
